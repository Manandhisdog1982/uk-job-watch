name: Job Watcher

on:
  schedule:
    # 05:30 UTC on weekdays (05:30 UK in winter, 06:30 in summer)
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect jobs
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python scrape.py
      - name: Save results
        run: |
          git config user.name "swj-job-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Job watcher run $(date -u +%F)" || echo "No changes"
          git push
