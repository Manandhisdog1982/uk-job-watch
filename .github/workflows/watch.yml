name: Job Watcher

on:
  schedule:
    # GitHub runs schedules in UTC and often starts them up to an hour late.
    # 04:30 UTC on weekdays (04:30 UK in winter, 05:30 in summer): the main run.
    - cron: "30 4 * * 1-5"
    # 05:40 UTC: a back up for a morning when the first did not fire. It stops at once if today's run already happened.
    - cron: "40 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect jobs
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python scrape.py
      - name: Save results
        run: |
          git config user.name "job-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Job watcher run $(date -u +%F)" || echo "No changes"
          git pull --rebase
          git push
